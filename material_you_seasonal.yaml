    /* ── MATERIAL YOU PILL-SHAPED THEME BUTTONS ── */
    a.button,
    button.button,
    .button,
    ha-button,
    mwc-button,
    ha-filled-button,
    ha-outlined-button,
    ha-tonal-button,
    ha-heading-badge,
    ha-assist-chip,
    ha-chip,
    .badge {
      border-radius: 9999px !important;
      --mdc-shape-small: 9999px !important;
      --mdc-button-border-radius: 9999px !important;
      --ha-button-border-radius: 9999px !important;
      --md-sys-shape-corner-full: 9999px !important;
    }

    a.button,
    button.button,
    .button.has-label,
    a.button.has-label,
    a.button.has-start {
      border-radius: 9999px !important;
      background: var(--primary-color) !important;
      color: var(--md-sys-color-on-primary, var(--primary-text-color)) !important;
      padding: 6px 18px !important;
      font-weight: 600 !important;
      text-decoration: none !important;
      border: 1.5px solid var(--ha-card-border-color, transparent) !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease !important;
      display: inline-flex !important;
      align-items: center !important;
      gap: 6px !important;
    }

    a.button:hover,
    button.button:hover,
    .button.has-label:hover,
    a.button.has-label:hover,
    a.button.has-start:hover {
      transform: scale(1.03) !important;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14) !important;
      opacity: 0.95 !important;
    }

    a.button ha-icon,
    a.button ha-svg-icon,
    .button ha-icon,
    .button ha-svg-icon {
      color: var(--md-sys-color-on-primary, inherit) !important;
      --icon-primary-color: var(--md-sys-color-on-primary, inherit) !important;
    }
