  card-mod-theme: Material You Herfst
  card-mod-sidebar: |
    :host {
      background: var(--sidebar-background-color) !important;
    }
    .menu {
      padding: 6px 8px !important;
    }
    paper-listbox {
      padding: 2px 0 !important;
      background: transparent !important;
    }
    a[role="option"],
    mwc-list-item {
      display: block !important;
      border-radius: 9999px !important;
      margin: 2px 0 !important;
      padding: 0 !important;
      min-height: 44px !important;
      height: 44px !important;
      background: transparent !important;
      text-decoration: none !important;
      transition: background-color 0.15s ease, box-shadow 0.15s ease !important;
    }
    paper-icon-item {
      margin: 0 !important;
      padding: 0 14px !important;
      min-height: 44px !important;
      height: 44px !important;
      border-radius: 9999px !important;
      background: transparent !important;
      font-weight: 500 !important;
      font-size: 14px !important;
      cursor: pointer !important;
      transition: background-color 0.15s ease, color 0.15s ease !important;
    }
    a[role="option"]:hover,
    a[role="option"]:hover paper-icon-item {
      background-color: rgba(128, 128, 128, 0.12) !important;
    }
    a[role="option"].iron-selected,
    a[role="option"][aria-selected="true"],
    a[role="option"].iron-selected paper-icon-item,
    a[role="option"][aria-selected="true"] paper-icon-item {
      background-color: var(--sidebar-selected-background-color) !important;
      color: var(--sidebar-selected-text-color) !important;
      font-weight: 600 !important;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08) !important;
    }
    a[role="option"].iron-selected ha-icon,
    a[role="option"].iron-selected ha-svg-icon,
    a[role="option"][aria-selected="true"] ha-icon,
    a[role="option"][aria-selected="true"] ha-svg-icon {
      color: var(--sidebar-selected-icon-color) !important;
      --icon-primary-color: var(--sidebar-selected-icon-color) !important;
    }
    .notification-badge {
      background: var(--primary-color) !important;
      color: var(--md-sys-color-on-primary, #000000) !important;
      border-radius: 9999px !important;
      font-weight: 700 !important;
      font-size: 11px !important;
      min-width: 20px !important;
      height: 20px !important;
      line-height: 20px !important;
      padding: 0 6px !important;
      box-shadow: 0 2px 6px rgba(0,0,0,0.18) !important;
    }
    .divider {
      background-color: var(--ha-card-border-color, var(--divider-color)) !important;
      opacity: 0.5 !important;
      margin: 6px 12px !important;
    }
    .profile {
      border-top: 1.5px solid var(--ha-card-border-color, var(--divider-color)) !important;
      margin-top: 2px !important;
      padding: 4px 8px !important;
    }
    .profile paper-icon-item {
      border-radius: 9999px !important;
    }
  card-mod-root: |
    #hue-backdrop {
      -webkit-mask: none !important;
      mask: none !important;
      opacity: 0.95 !important;
    }
    ha-dialog, hue-dialog {
      --ha-dialog-surface-background: var(--dialog-background-color, var(--ha-card-background)) !important;
      --mdc-dialog-surface-fill-color: var(--dialog-background-color, var(--ha-card-background)) !important;
      --hue-screen-background: var(--dialog-background-color, var(--ha-card-background)) !important;
      --hue-heading-text-color: var(--primary-text-color) !important;
    }
