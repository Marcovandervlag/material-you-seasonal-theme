# ==============================================================================
# 🌸🍂 MATERIAL YOU SEIZOENEN THEMA VOOR HOME ASSISTANT ❄️☀️
#
# ✅ 1. DASHBOARD THEMATISERING (100% BEHOUDEN & SOLIDE):
#       - 100% solide dekkende achtergronden voor alle kaarten & pop-ups (geen frosted glass)
#       - Volledig afgestemd contrast (100% zwart in licht / 100% wit in donker)
#       - Zachte, hoogwaardige pastelkleuren voor knoppen, sliders en controls
#       - Inactieve slider-balken hebben een zachte, schone tint in plaats van moddergrijs
#       - Schakelaars (toggles) nemen altijd netjes de seizoenskleur aan
#       - Laser-precieze border-radius: fill, range-slider en border lopen 100% naadloos gelijk
# ✅ 2. BACKEND / INSTELLINGEN / INTEGRATIES THEMATISERING (Material 3 MD3 & MDC):
#       - md-sys-color-surface & container tokens zorgen dat instellingen/integraties NOOIT meer wit uitslaan in Dark Mode
#       - Icoontjes in instellingen-badges zijn 100% PUUR WIT (#ffffff) in Light & Dark mode
#       - Volledige kleurenharmonie in Instellingen, Integraties, Apparaten, Sidebar, Tabellen, Formulieren
# ✅ 3. 4 SEIZOENEN MET VERFIJNDE PASTEL LIGHT MODES & SFEERVOLLE DARK MODES:
#       - 🍂 Herfst: Warm Terracotta & Zacht Abrikoos/Perzik (#fcbe8b)
#       - ❄️ Winter: Helder IJs & Zacht Pastel Hemelsblauw (#8ec8f6)
#       - 🌸 Lente:  Fris Bloemblad & Zacht Saliegroen (#9cd4a8)
#       - 🌴 Zomer:  Warm Zand & Zachte Warme Honing (#f4a853)
# ==============================================================================

